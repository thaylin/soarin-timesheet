services:
  db:
    image: postgres:16-alpine   # official image is multi-arch (amd64 + arm64)
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soarin}
      POSTGRES_USER: ${POSTGRES_USER:-soarin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Intentionally no "ports:" - the database is reachable only by the app container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: soarin-timesheet:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-soarin}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-soarin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      # Published on all interfaces of the Pi (LAN). To restrict to one
      # interface use e.g. "192.168.1.50:8080:8080". Do not port-forward this.
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
